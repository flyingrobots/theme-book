    <rect x="24" y="70" width="516" height="180" rx="10" fill="#ffffff" stroke="#dfdfe1" stroke-width="1"/>
    <text x="40" y="96" font-size="13.5" font-weight="600" fill="#1c1f25">Release Summary</text>
    <text x="40" y="114" font-size="11.5" fill="#51555e">Body &amp; muted copy, focus input, primary/secondary actions, and accent hover.</text>


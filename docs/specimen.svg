    <text x="24" y="54" font-size="11.5" fill="#51555e">seed=&quot;#2563eb&quot; · generator=poline · preset=shadcn</text>

    <!-- Audit pill -->
    <rect x="430" y="18" width="110" height="24" rx="12" fill="#eff0f2" stroke="#dfdfe1" stroke-width="1"/>
    <text x="485" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#51555e">✓ 18/18 wcag-aa</text>


  <g transform="translate(24, 24)">
    <!-- Panel background -->
    <rect x="0" y="0" width="564" height="380" rx="14" fill="#fdfdff" stroke="#dfdfe1" stroke-width="1.5"/>

    <!-- Top header row -->

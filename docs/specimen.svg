    <text x="52" y="148" font-size="11.5" fill="#1c1f25">theme-book --seed #2563eb</text>

    <!-- Accent hover badge beside input -->
    <rect x="288" y="128" width="136" height="32" rx="6" fill="#eaebfe" stroke="#dfdfe1" stroke-width="1"/>
    <text x="356" y="148" text-anchor="middle" font-size="11.5" font-weight="500" fill="#000000">Accent / Hover</text>

    <!-- Primary + Secondary Buttons -->
